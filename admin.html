<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Админ-панель — Вихляев Авто</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Login ===== -->
  <div class="gate" id="adminLogin">
    <div class="gate__box">
      <div class="gate__logo">В</div>
      <h1>Админ-панель</h1>
      <p>Вход для сотрудников</p>
      <form id="adminLoginForm" novalidate>
        <div class="field"><label for="admEmail">Email</label><input type="email" id="admEmail" autocomplete="username" required /></div>
        <div class="field"><label for="admPass">Пароль</label><input type="password" id="admPass" autocomplete="current-password" required /></div>
        <p class="gate__err" id="admErr" aria-live="polite"></p>
        <button type="submit" class="btn btn--accent btn--block btn--lg" id="admLoginBtn">Войти</button>
      </form>
      <p class="admin__hint" id="admConfigHint" hidden>Supabase не настроен. Заполните ключи в config.js и прогоните supabase/schema.sql.</p>
    </div>
  </div>

  <!-- ===== Panel ===== -->
  <div class="admin" id="adminPanel" hidden>
    <header class="admin__top">
      <a href="index.html" class="logo"><span class="logo__mark">В</span><span class="logo__text">ВИХЛЯЕВ<b>АВТО</b></span></a>
      <span class="admin__tag">админ-панель</span>
      <span class="admin__user" id="admWho"></span>
      <button class="btn btn--ghost" id="admLogout">Выйти</button>
    </header>

    <nav class="admin__tabs">
      <button class="admin__tab is-active" data-tab="cars">Авто</button>
      <button class="admin__tab" data-tab="leads">Заявки</button>
      <button class="admin__tab" data-tab="feedback">Отзывы</button>
    </nav>

    <!-- Cars tab -->
    <section class="admin__pane" id="tab-cars">
      <div class="admin__bar">
        <h2>Автомобили <span id="carsCount" class="admin__count"></span></h2>
        <div class="admin__bar-btns">
          <button class="btn btn--ghost" id="exportBtn" title="Скачать cars.js для коммита в GitHub">⬇ Экспорт cars.js</button>
          <button class="btn btn--accent" id="addCarBtn">+ Добавить авто</button>
        </div>
      </div>
      <p class="admin__hint" id="modeHint"></p>
      <div class="admin__table-wrap">
        <table class="admin__table" id="carsTable">
          <thead><tr><th>Фото</th><th>Марка / модель</th><th>Год</th><th>Страна</th><th>Цена</th><th>Статус</th><th></th></tr></thead>
          <tbody id="carsBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Leads tab -->
    <section class="admin__pane" id="tab-leads" hidden>
      <div class="admin__bar"><h2>Заявки <span id="leadsCount" class="admin__count"></span></h2></div>
      <div class="admin__table-wrap">
        <table class="admin__table"><thead><tr><th>Дата</th><th>Тема</th><th>Имя</th><th>Телефон</th><th>Комментарий</th></tr></thead>
          <tbody id="leadsBody"></tbody></table>
      </div>
    </section>

    <!-- Feedback tab -->
    <section class="admin__pane" id="tab-feedback" hidden>
      <div class="admin__bar"><h2>Отзывы <span id="fbCount" class="admin__count"></span></h2></div>
      <div class="admin__table-wrap">
        <table class="admin__table"><thead><tr><th>Дата</th><th>Сообщение</th><th>Контакт</th><th>Страница</th></tr></thead>
          <tbody id="fbBody"></tbody></table>
      </div>
    </section>
  </div>

  <!-- ===== Car edit modal ===== -->
  <div class="modal" id="carEdit" hidden>
    <div class="modal__overlay" data-edit-close></div>
    <div class="modal__box modal__box--wide" role="dialog" aria-modal="true">
      <button class="modal__close" data-edit-close aria-label="Закрыть">×</button>
      <h3 id="editTitle">Авто</h3>
      <form id="carForm" class="admin__form">
        <input type="hidden" id="cId" />
        <div class="admin__grid">
          <div class="field"><label>Марка</label><input id="cBrand" required /></div>
          <div class="field"><label>Модель</label><input id="cModel" required /></div>
          <div class="field"><label>Год</label><input id="cYear" type="number" min="1990" max="2027" /></div>
          <div class="field"><label>Страна</label>
            <select id="cCountry"><option value="jp">Япония</option><option value="kr">Корея</option><option value="cn">Китай</option></select></div>
          <div class="field"><label>Кузов</label><input id="cBody" list="bodyList" /></div>
          <div class="field"><label>Двигатель, л</label><input id="cEngine" type="number" step="0.1" min="0" /></div>
          <div class="field"><label>Топливо</label><input id="cFuel" list="fuelList" /></div>
          <div class="field"><label>Привод</label>
            <select id="cDrive"><option>FWD</option><option>AWD</option><option>RWD</option></select></div>
          <div class="field"><label>Пробег, км</label><input id="cMileage" type="number" min="0" /></div>
          <div class="field"><label>КПП</label><input id="cTrans" /></div>
          <div class="field"><label>Цена под ключ, ₽</label><input id="cPrice" type="number" min="0" required /></div>
          <div class="field"><label>Аукцион</label><input id="cAuction" /></div>
          <div class="field"><label>Статус</label>
            <select id="cStatus"><option value="order">Под заказ</option><option value="in_stock">В наличии</option><option value="sold">Продано</option></select></div>
          <div class="field"><label>Цвет-заглушка</label><input id="cColor" type="color" value="#2a3852" /></div>
        </div>
        <label class="checkbox"><input type="checkbox" id="cFeatured" /><span>Отметить как «хит/новинка»</span></label>

        <div class="field">
          <label>Фото</label>
          <input type="file" id="cPhotoFile" accept="image/*" multiple />
          <div class="admin__photos" id="cPhotos"></div>
        </div>

        <p class="gate__err" id="editErr"></p>
        <div class="admin__form-actions">
          <button type="submit" class="btn btn--accent btn--lg" id="saveCarBtn">Сохранить</button>
          <button type="button" class="btn btn--ghost" data-edit-close>Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="bodyList"><option>Седан</option><option>Кроссовер</option><option>Внедорожник</option><option>Минивэн</option><option>Хэтчбек</option><option>Универсал</option><option>Лифтбек</option></datalist>
  <datalist id="fuelList"><option>Бензин</option><option>Дизель</option><option>Гибрид</option><option>Электро</option></datalist>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="cars.js"></script>
  <script src="db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
